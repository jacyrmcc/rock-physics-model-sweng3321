[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlrpm"
version = "0.1.0"
description = "Rock-Physics Machine-Learning Prediction System (proof of concept)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.scripts]
mlrpm = "mlrpm.__main__:main"

[tool.setuptools]
packages = ["mlrpm"]

[tool.setuptools.package-data]
mlrpm = ["default_config.yaml"]
